<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- EcoYard app icon. Full-bleed square, no rounded corners (iOS adds its own mask).
       All artwork sits inside a 680 px circle around the centre, the Android adaptive-icon safe zone. -->
  <rect width="1024" height="1024" fill="#1F5C3F"/>
  <circle cx="512" cy="530" r="400" fill="#2C7A55"/>

  <g transform="translate(512 560) scale(1.1) translate(-527 -565)">
  <!-- leaf -->
  <g transform="translate(512 655) rotate(-18)">
    <path d="M-275 0 C-110 -135 110 -135 275 0 C110 135 -110 135 -275 0 Z" fill="#8CCB8F"/>
    <path d="M-275 0 L-300 12" stroke="#8CCB8F" stroke-width="16" stroke-linecap="round"/>
    <path d="M-245 0 L235 0" stroke="#2C7A55" stroke-width="14" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- bird -->
  <g transform="translate(500 468)">
    <!-- legs -->
    <path d="M-18 98 L-18 124 M26 98 L26 124" stroke="#E8A317" stroke-width="9" stroke-linecap="round"/>
    <!-- tail -->
    <path d="M-92 6 C-150 -16 -218 -30 -258 -10 C-222 22 -164 56 -98 56 Z" fill="#FFFFFF"/>
    <!-- body and head -->
    <ellipse cx="0" cy="20" rx="116" ry="84" fill="#FFFFFF"/>
    <circle cx="94" cy="-42" r="60" fill="#FFFFFF"/>
    <!-- wing -->
    <path d="M-72 16 C-30 -32 48 -26 80 20 C38 60 -36 62 -72 16 Z" fill="#CFE6D2"/>
    <!-- eye -->
    <circle cx="112" cy="-56" r="12" fill="#17301F"/>
    <circle cx="116" cy="-60" r="3.5" fill="#FFFFFF"/>
    <!-- beak -->
    <path d="M146 -60 L208 -42 L146 -26 Z" fill="#E8A317" stroke="#E8A317" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <!-- sound: three arcs leaving the beak -->
  <g fill="none" stroke="#A8D5A2" stroke-width="14" stroke-linecap="round">
    <path d="M751 403 A40 40 0 0 1 751 453" opacity="1"/>
    <path d="M775 385 A70 70 0 0 1 775 471" opacity="0.75"/>
    <path d="M799 366 A100 100 0 0 1 799 490" opacity="0.5"/>
  </g>
  </g>
</svg>
